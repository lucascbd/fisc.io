server {
    listen 80;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para o backend
    # ^~ impede que o bloco regex de .png/.jpg intercepte URLs de API com extensão de imagem
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ícones servidos pelo backend (inclui uploads dinâmicos)
    # ^~ impede que o bloco regex de .png/.jpg intercepte antes do proxy
    location ^~ /icons/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Arquivos estáticos com cache longo
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker sem cache
    location = /firebase-messaging-sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA — no-cache para forçar revalidação do index.html e assets buildados
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
